# Mirrors upstream releases as Arch packages. `sync` merges upstream main
# every day (or checks out one release tag when asked), `prepare` computes the
# checksums and writes the packaging commit, `build` makes the four packages,
# `publish` creates or updates the fork's GitHub release, and `aur` pushes the
# binary package's AUR files when the AUR key is configured.
name: Arch mirror

on:
  schedule:
    # Daily, off the hour: GitHub's queue is busiest at :00.
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream release to mirror, without the "v" (default: the latest release)'
        type: string
        required: false
      force_rebuild:
        description: 'Bump pkgrel and move the release tag to the new packaging commit'
        type: boolean
        default: false

# Push main and the release tags; open the merge-conflict issue.
permissions:
  contents: write
  issues: write

# One mirror run at a time, and a started run is never cancelled: it may be
# halfway through pushing.
concurrency:
  group: arch-mirror
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
      commits_ahead: ${{ steps.resolve.outputs.commits_ahead }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_INPUT: ${{ inputs.version }}
      FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
    steps:
      # The fork's own repository, whose token may push main.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main, or check out the release tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/baocode-dev/baocode.git
          # The merge commit below needs an author: checkout configures none.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Upstream tags live under their own namespace: v<version> in the
          # fork is a packaging tag, not upstream's release tag.
          git fetch --no-tags upstream \
            '+refs/heads/main:refs/remotes/upstream/main' \
            '+refs/tags/*:refs/upstream-tags/*'

          version_input=${VERSION_INPUT#v}
          if [[ -n $version_input ]]; then
            explicit=true
            version=$version_input
          else
            explicit=false
            # The latest release, not a prerelease and not a draft.
            tag=$(gh api repos/baocode-dev/baocode/releases/latest --jq .tag_name)
            version=${tag#v}
          fi
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a marketing version: $version"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/upstream-tags/v$version^{commit}" >/dev/null; then
            echo "::error::Upstream has no v$version tag"
            exit 1
          fi

          if [[ $explicit == true ]]; then
            # A version exists only as an upstream release.
            if ! gh api "repos/baocode-dev/baocode/releases/tags/v$version" >/dev/null; then
              echo "::error::Upstream has no v$version release"
              exit 1
            fi
            # The release's commit, not main: main stays as it is.
            source_commit=$(git rev-parse "refs/upstream-tags/v$version^{commit}")
            commits_ahead=0
            git checkout --detach "$source_commit"
            # The fork's archive of this commit must resolve before prepare
            # hashes it. A temporary tag keeps the commit reachable there;
            # prepare deletes it once the release tag is pushed.
            git push --force origin \
              "$source_commit:refs/tags/arch-source-$version"
          else
            git checkout -B main origin/main
            if ! git merge --no-ff -m "Merge upstream main" refs/remotes/upstream/main; then
              conflicts=$(git diff --name-only --diff-filter=U || true)
              # A GitHub App installation token (GITHUB_TOKEN) needs the
              # `workflows` permission to create or update files under
              # .github/workflows/, and no workflow `permissions:` key can
              # grant it (ADR-0002). Conflicts confined to that directory
              # are resolved by keeping the fork's files below, not reported
              # as a merge failure that needs a human.
              only_workflows=true
              if [[ -z $conflicts ]]; then
                only_workflows=false
              fi
              while IFS= read -r file; do
                [[ $file == .github/workflows/* ]] || only_workflows=false
              done <<< "$conflicts"

              if [[ $only_workflows == true ]]; then
                git restore --source=origin/main --staged --worktree -- .github/workflows
                git commit --no-edit
              else
                git merge --abort || true

                run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                body=$(printf 'Merging upstream main into main failed.\n\n- Run: %s\n- Conflicted files:\n' "$run_url")
                if [[ -n $conflicts ]]; then
                  while IFS= read -r file; do
                    body+="- $file"$'\n'
                  done <<< "$conflicts"
                else
                  body+="- (git merge failed without listing a conflict)"$'\n'
                fi

                # One open issue per problem: a new run comments on it instead
                # of opening another.
                existing=$(gh issue list --state open --limit 100 --json number,title \
                  --jq '[.[] | select(.title == "[arch] 上游合并冲突") | .number] | first // empty')
                if [[ -n $existing ]]; then
                  gh issue comment "$existing" --body "$body"
                else
                  gh issue create --title '[arch] 上游合并冲突' \
                    --label ready-for-human --body "$body"
                fi
                echo "::error::Upstream merge conflicted; see the open issue"
                exit 1
              fi
            fi

            # The merge commit must not change .github/workflows/: GITHUB_TOKEN
            # cannot push such a change (ADR-0002). Keep the fork's files, as
            # they were on main before the merge, and fold that into the merge
            # commit itself.
            if ! git diff --quiet origin/main -- .github/workflows; then
              git restore --source=origin/main --staged --worktree -- .github/workflows
              echo "::notice::Kept the fork's .github/workflows/; GITHUB_TOKEN cannot push workflow changes"
              git commit --amend --no-edit
            fi
            git push origin main
            source_commit=$(git rev-parse HEAD)
            commits_ahead=$(git rev-list --count "refs/upstream-tags/v$version..HEAD")
          fi

          # Only an upstream release is mirrored, and only once: the daily
          # merge and push above happen even when this is false. An explicit
          # version is updated idempotently, and a forced rebuild re-releases
          # the same version.
          should_release=false
          if [[ $explicit == true || $FORCE_REBUILD == true ]]; then
            should_release=true
          elif releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name'); then
            if ! grep -Fxq "v$version" <<< "$releases"; then
              should_release=true
            fi
          else
            echo "::error::Could not list the fork's releases"
            exit 1
          fi

          {
            echo "version=$version"
            echo "source_commit=$source_commit"
            echo "commits_ahead=$commits_ahead"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version source_commit=$source_commit commits_ahead=$commits_ahead should_release=$should_release"

  prepare:
    name: Prepare the packaging commit
    needs: sync
    if: needs.sync.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # base-devel supplies makepkg (and refuses to run it as root), so
    # --printsrcinfo runs as the throwaway builder below. dart is Arch's
    # extra package, 3.13.x at the time of writing: bump.dart only imports
    # dart:convert and dart:io and needs the 3.13 language, so it runs
    # directly as a script (no pub get) -- the 3.13.4 the release builds use
    # has no Arch package.
    container: archlinux:base-devel
    outputs:
      packaging_commit: ${{ steps.packaging.outputs.packaging_commit }}
      version: ${{ steps.packaging.outputs.version }}
      tag: ${{ steps.packaging.outputs.tag }}
      source_commit: ${{ steps.packaging.outputs.source_commit }}
      source_pkgver: ${{ steps.packaging.outputs.source_pkgver }}
      bin_pkgver: ${{ steps.packaging.outputs.bin_pkgver }}
      pkgrel: ${{ steps.packaging.outputs.pkgrel }}
      assets: ${{ steps.packaging.outputs.assets }}
      notes_paths: ${{ steps.packaging.outputs.notes_paths }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.sync.outputs.version }}
      SOURCE_COMMIT: ${{ needs.sync.outputs.source_commit }}
      COMMITS_AHEAD: ${{ needs.sync.outputs.commits_ahead }}
      VERSION_INPUT: ${{ inputs.version }}
      FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
    steps:
      # The bare image has neither git nor the rest of the runner's tools;
      # the checkout action needs git, so install first.
      - name: Install the packaging tools
        shell: bash
        run: |
          set -euo pipefail
          pacman --disable-sandbox -Syu --noconfirm --needed git curl jq dart

      # fetch-depth 0 also fetches every tag, including arch-source-<version>
      # for an explicit version.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Rewrite the PKGBUILDs and push the packaging commit
        id: packaging
        shell: bash
        run: |
          set -euo pipefail

          # The checkout is owned by the runner's user while this container
          # runs as root: git calls that dubious ownership and refuses the
          # first checkout below. Trust the workspace up front; it stays
          # trusted after the chown to builder.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Default path: the merge commit sync pushed to main. Explicit
          # version: the upstream tag's commit sync kept reachable, plus the
          # packaging tree from main (an upstream tag predates packaging/) --
          # and bump.dart, kept outside the checkout since that commit has
          # no tool/arch/.
          cp tool/arch/bump.dart "$RUNNER_TEMP/bump.dart"
          if [[ -n ${VERSION_INPUT#v} ]]; then
            git checkout --detach "refs/tags/arch-source-$VERSION"
            git checkout origin/main -- packaging
          else
            git checkout -B main origin/main
          fi
          if [[ $(git rev-parse HEAD) != "$SOURCE_COMMIT" ]]; then
            echo "::error::HEAD is $(git rev-parse HEAD), not the synced $SOURCE_COMMIT"
            exit 1
          fi

          # A new upstream version starts at pkgrel 1; rerunning the same
          # version keeps the pkgrel it already has; a forced rebuild adds
          # one so pacman sees it as newer.
          current_pkgrel=$(sed -n 's/^pkgrel=//p' packaging/baocode-bin/PKGBUILD)
          current_pkgver=$(sed -n 's/^pkgver=//p' packaging/baocode-bin/PKGBUILD)
          [[ $current_pkgrel =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::Not a pkgrel: $current_pkgrel"; exit 1; }
          if [[ $FORCE_REBUILD == true ]]; then
            pkgrel=$(dart "$RUNNER_TEMP/bump.dart" pkgrel --current "$current_pkgrel" --force)
          elif [[ $current_pkgver == "$VERSION" ]]; then
            pkgrel=$current_pkgrel
          else
            pkgrel=1
          fi

          source_pkgver=$(dart "$RUNNER_TEMP/bump.dart" pkgver \
            --upstream "$VERSION" --ahead "$COMMITS_AHEAD" --short-sha "$SOURCE_COMMIT")
          bin_pkgver=$VERSION

          # The fork's archive of the source commit. main was pushed by sync,
          # or arch-source-<version> holds the commit; retries only wait for
          # GitHub to generate the tarball.
          archive="https://github.com/$GITHUB_REPOSITORY/archive/$SOURCE_COMMIT.tar.gz"
          fork_archive="$RUNNER_TEMP/baocode-fork.tar.gz"
          curl -fsSL --retry 10 --retry-delay 5 --retry-all-errors \
            -o "$fork_archive" "$archive"
          fork_sha=$(sha256sum "$fork_archive" | cut -d' ' -f1)

          # The upstream release's own tarballs, whose GitHub per-asset
          # digests are used when present (all current assets have one).
          release_json="$RUNNER_TEMP/upstream-release.json"
          curl -fsSL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o "$release_json" \
            "https://api.github.com/repos/baocode-dev/baocode/releases/tags/v$VERSION"

          asset_sha256() {
            local name=$1 id digest
            id=$(jq -er --arg name "$name" \
              '.assets[] | select(.name == $name) | .id' "$release_json") \
              || { echo "::error::Upstream release has no $name asset"; exit 1; }
            digest=$(jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | .digest // empty' "$release_json")
            if [[ $digest == sha256:* ]]; then
              printf '%s\n' "${digest#sha256:}"
              return 0
            fi
            # No digest on the asset: hash the download instead.
            curl -fsSL --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/octet-stream' \
              -o "$RUNNER_TEMP/upstream-asset.tar.gz" \
              "https://api.github.com/repos/baocode-dev/baocode/releases/assets/$id"
            sha256sum "$RUNNER_TEMP/upstream-asset.tar.gz" | cut -d' ' -f1
          }

          amd64_sha=$(asset_sha256 "BaoCode-$VERSION-linux-amd64.tar.gz")
          arm64_sha=$(asset_sha256 "BaoCode-$VERSION-linux-arm64.tar.gz")

          # bump.dart owns pkgver, pkgrel, _commit and the checksum arrays;
          # the source package's upstream tarball names come from
          # _upstream_version, which it leaves alone.
          sed -i "s/^_upstream_version=.*/_upstream_version=$VERSION/" \
            packaging/baocode/PKGBUILD

          dart "$RUNNER_TEMP/bump.dart" rewrite \
            --file packaging/baocode/PKGBUILD \
            --pkgver "$source_pkgver" \
            --pkgrel "$pkgrel" \
            --commit "$SOURCE_COMMIT" \
            --sums "sha256sums_x86_64=$fork_sha,$amd64_sha" \
            --sums "sha256sums_aarch64=$fork_sha,$arm64_sha"
          dart "$RUNNER_TEMP/bump.dart" rewrite \
            --file packaging/baocode-bin/PKGBUILD \
            --pkgver "$bin_pkgver" --pkgrel "$pkgrel" \
            --sums "sha256sums_x86_64=$amd64_sha" \
            --sums "sha256sums_aarch64=$arm64_sha"
          dart "$RUNNER_TEMP/bump.dart" rewrite \
            --file packaging/aur/baocode-bin/PKGBUILD \
            --pkgver "$bin_pkgver" --pkgrel "$pkgrel" \
            --sums "sha256sums_x86_64=$amd64_sha" \
            --sums "sha256sums_aarch64=$arm64_sha"

          # makepkg refuses root; a throwaway builder owns the workspace so
          # it can write src/ and .SRCINFO.
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          (
            cd packaging/aur/baocode-bin
            runuser -u builder -- env HOME=/home/builder makepkg --printsrcinfo
          ) > packaging/aur/baocode-bin/.SRCINFO

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/baocode/PKGBUILD \
            packaging/baocode-bin/PKGBUILD \
            packaging/aur/baocode-bin/PKGBUILD \
            packaging/aur/baocode-bin/.SRCINFO
          if git diff --cached --quiet; then
            echo "::notice::The PKGBUILDs already say $VERSION; reusing $(git rev-parse HEAD)"
            packaging_commit=$(git rev-parse HEAD)
          else
            git commit -m "chore(arch): mirror $VERSION (pkgrel $pkgrel)"
            packaging_commit=$(git rev-parse HEAD)
          fi

          if [[ -n ${VERSION_INPUT#v} ]]; then
            # Explicit version: the packaging commit sits on the release's
            # commit and main does not move.
            git tag -f "v$VERSION" "$packaging_commit"
            git push --force origin "refs/tags/v$VERSION"
            if ! git push origin --delete "refs/tags/arch-source-$VERSION"; then
              echo "::warning::Could not delete arch-source-$VERSION"
            fi
          else
            # Default path: the packaging commit on main, the release tag on
            # it. The tag is moved when a previous run failed before publish.
            git push origin "HEAD:main"
            git tag -f "v$VERSION" "$packaging_commit"
            git push --force origin "refs/tags/v$VERSION"
          fi

          # What publish will need: the packages makepkg is expected to make
          # and the mirrored release notes found in the built tree.
          assets=$(printf '["%s","%s","%s","%s"]' \
            "baocode-$source_pkgver-$pkgrel-x86_64.pkg.tar.zst" \
            "baocode-$source_pkgver-$pkgrel-aarch64.pkg.tar.zst" \
            "baocode-bin-$bin_pkgver-$pkgrel-x86_64.pkg.tar.zst" \
            "baocode-bin-$bin_pkgver-$pkgrel-aarch64.pkg.tar.zst")
          notes=()
          for language in en zh; do
            path="release-notes/$VERSION.$language.md"
            if git cat-file -e "HEAD:$path" 2>/dev/null; then
              notes+=("$path")
            fi
          done
          notes_paths=${notes[*]:-}

          {
            echo "packaging_commit=$packaging_commit"
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "source_commit=$SOURCE_COMMIT"
            echo "source_pkgver=$source_pkgver"
            echo "bin_pkgver=$bin_pkgver"
            echo "pkgrel=$pkgrel"
            echo "assets=$assets"
            echo "notes_paths=$notes_paths"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Packaged $VERSION at $packaging_commit (pkgrel $pkgrel)"

  build:
    name: Build ${{ matrix.pkg }} (${{ matrix.arch }})
    # sync is listed as well as prepare: needs only exposes the outputs of a
    # job's direct dependencies, and the condition below reads sync's.
    needs: [sync, prepare]
    if: needs.sync.outputs.should_release == 'true'
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # x86_64 runs the official Arch image; aarch64 runs the Arch Linux ARM
    # image from https://github.com/Menci/docker-archlinuxarm, which that
    # project builds on GitHub Actions and publishes for linux/arm64 (the
    # official archlinux image has no aarch64 variant). Its base-devel tag
    # supplies makepkg and the base-devel group.
    container: ${{ matrix.arch == 'aarch64' && 'menci/archlinuxarm:base-devel' || 'archlinux:base-devel' }}
    permissions:
      contents: read
    strategy:
      # A failed leg must not cancel the others; see continue-on-error below.
      fail-fast: false
      matrix:
        pkg: [baocode, baocode-bin]
        arch: [x86_64, aarch64]
        # Repository variable ARCH_AARCH64_SOURCE=off skips the aarch64 source
        # package leg, which clones Flutter and compiles the app on ARM; unset
        # or any other value keeps it. This is a one-value axis rather than a
        # job-level `if` because a job `if` cannot read the matrix, and an
        # include entry would add the leg back after exclude (include is
        # processed after exclude). Off yields ["off"], so exclude matches the
        # baocode/aarch64 combination; on yields ["on"], which matches none.
        aarch64_source: ${{ fromJSON(vars.ARCH_AARCH64_SOURCE == 'off' && '["off"]' || '["on"]') }}
        exclude:
          - pkg: baocode
            arch: aarch64
            aarch64_source: 'off'
    # The aarch64 source build may fail (no native Flutter SDK archive; the
    # PKGBUILD clones it) and must not block publish. A failed leg uploads no
    # artifact, which publish must treat as a missing package.
    continue-on-error: ${{ matrix.pkg == 'baocode' && matrix.arch == 'aarch64' }}
    # The source package downloads Flutter and Rust and compiles the app; the
    # binary package only unpacks the upstream archive.
    timeout-minutes: 360
    env:
      PKG: ${{ matrix.pkg }}
      ARCH: ${{ matrix.arch }}
      # The version prepare rewrote into the PKGBUILD.
      PKG_VERSION: ${{ matrix.pkg == 'baocode' && needs.prepare.outputs.source_pkgver || needs.prepare.outputs.bin_pkgver }}
      PKGREL: ${{ needs.prepare.outputs.pkgrel }}
    steps:
      # The bare image has neither git (needed by the checkout action) nor
      # namcap (needed by the validation step), so install them first.
      - name: Install the build tools
        shell: bash
        run: |
          set -euo pipefail
          pacman --disable-sandbox -Syu --noconfirm --needed git namcap

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.packaging_commit }}
          fetch-depth: 1

      - name: Create the non-root builder
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # Arch Linux ARM's makepkg.conf still defaults to .pkg.tar.xz; the
          # validation, artifacts, release assets and updater all name
          # .pkg.tar.zst, so force it in this job's container only.
          sed -i "s|^PKGEXT=.*|PKGEXT='.pkg.tar.zst'|" /etc/makepkg.conf

      - name: Build the package
        shell: bash
        run: |
          set -euo pipefail
          cd "packaging/$PKG"

          # makepkg refuses to run as root. Root installs the PKGBUILD's
          # depends/makedepends, then makepkg builds as builder; no passwordless
          # sudo is involved.
          # shellcheck disable=SC1091
          source PKGBUILD
          build_deps=("${depends[@]}")
          if [[ -n ${makedepends+x} ]]; then
            build_deps+=("${makedepends[@]}")
          fi
          pacman --disable-sandbox -S --noconfirm --needed --asdeps "${build_deps[@]}"
          runuser -u builder -- env HOME=/home/builder makepkg --noconfirm

      - name: Validate the package
        shell: bash
        run: |
          set -euo pipefail
          # pacman localizes its field names; the assertions below read them.
          export LC_ALL=C
          pkgfile=$(find "packaging/$PKG" -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)
          if [[ -z $pkgfile ]]; then
            echo "::error::makepkg produced no .pkg.tar.zst in packaging/$PKG"
            exit 1
          fi

          echo "::group::pacman -Qip"
          info=$(pacman -Qip "$pkgfile")
          printf '%s\n' "$info"
          grep -Eq "^Name +: $PKG$" <<< "$info" \
            || { echo "::error::unexpected package name"; exit 1; }
          grep -Eq "^Architecture +: $ARCH$" <<< "$info" \
            || { echo "::error::unexpected package architecture"; exit 1; }
          grep -Eq "^Version +: $PKG_VERSION-$PKGREL$" <<< "$info" \
            || { echo "::error::unexpected package version"; exit 1; }
          echo "::endgroup::"

          echo "::group::namcap"
          report=$(namcap "$pkgfile")
          printf '%s\n' "$report"
          # Warnings are expected: the bundle ships unstripped binaries. An
          # error means the package itself is malformed.
          if grep -q '^E:' <<< "$report"; then
            echo "::error::namcap reported package errors"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::bsdtar -tf"
          # Package members have no leading slash; also accept ./ in case
          # makepkg's tar invocation changes.
          entries=$(bsdtar -tf "$pkgfile" | sed -e 's|^\./||' -e 's|^/||')
          for path in \
            opt/baocode/baocode \
            usr/bin/baocode \
            usr/share/applications/baocode.desktop \
            usr/share/icons/hicolor/128x128/apps/baocode.png \
            opt/baocode/remote/VERSION
          do
            if ! grep -Fxq "$path" <<< "$entries"; then
              echo "::error::the package is missing $path"
              exit 1
            fi
          done
          echo "::endgroup::"

          # The checksum references the basename, like a downloaded release
          # asset, so publish can ship it as-is.
          package_dir=$(dirname "$pkgfile")
          package_name=$(basename "$pkgfile")
          (
            cd "$package_dir"
            sha256sum "$package_name" > "$package_name.sha256"
          )
          echo "::notice::Built and validated $pkgfile"

      # The artifact name is publish's contract: arch-<pkgname>-<arch>.
      - name: Upload the package
        uses: actions/upload-artifact@v6
        with:
          name: arch-${{ matrix.pkg }}-${{ matrix.arch }}
          path: |
            packaging/${{ matrix.pkg }}/*.pkg.tar.zst
            packaging/${{ matrix.pkg }}/*.pkg.tar.zst.sha256
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish the release
    # sync is listed alongside prepare for its outputs (the version); build
    # only gates on success, and a failed aarch64 source leg is allowed there.
    needs: [sync, prepare, build]
    if: needs.sync.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # The AUR job validates the files at the release tag, not at main: an
      # explicit version's packaging commit is not on main.
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The release notes prepare found live in the packaging commit's tree,
      # which the release tag points at.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 1

      # A leg that failed, the aarch64 source package above all, uploaded no
      # artifact; the pattern downloads the artifacts that do exist. A leg
      # with no package at all fails the build job, which skips this job.
      - name: Download the Arch packages
        uses: actions/download-artifact@v7
        with:
          pattern: arch-*
          path: dist
          merge-multiple: true

      - name: Create or update the release
        id: release
        shell: bash
        env:
          VERSION: ${{ needs.sync.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          NOTES_PATHS: ${{ needs.prepare.outputs.notes_paths }}
        run: |
          set -euo pipefail

          # Mirrored upstream notes: the packaging commit's release-notes
          # files, preferring the English one, or upstream's release body
          # when the packaging tree has none.
          notes_file=$RUNNER_TEMP/upstream-notes.md
          if [[ -n $NOTES_PATHS ]]; then
            read -r -a paths <<< "$NOTES_PATHS"
            chosen=${paths[0]}
            for path in "${paths[@]}"; do
              if [[ $path == *.en.md ]]; then
                chosen=$path
                break
              fi
            done
            cp "$chosen" "$notes_file"
          else
            gh api "repos/baocode-dev/baocode/releases/tags/v$VERSION" \
              --jq '.body // ""' > "$notes_file"
          fi

          # Only this run's Arch packages ship: no checksum files, no
          # upstream assets. Sorted by asset name so the body is stable.
          mapfile -t packages < <(
            while IFS= read -r -d '' package; do
              printf '%s\t%s\n' "$(basename "$package")" "$package"
            done < <(find dist -type f -name '*.pkg.tar.zst' -print0) |
              LC_ALL=C sort | cut -f2-
          )
          if ((${#packages[@]} == 0)); then
            echo "::error::No Arch package was downloaded; nothing to publish"
            exit 1
          fi

          # The asset the pacman -U line points at: the binary x86_64 package
          # when it was built, else any x86_64 package, else the first one
          # (an aarch64 / ARM run).
          install_asset=
          for package in "${packages[@]}"; do
            name=$(basename "$package")
            if [[ $name == baocode-bin-*-x86_64.pkg.tar.zst ]]; then
              install_asset=$name
              break
            fi
          done
          if [[ -z $install_asset ]]; then
            for package in "${packages[@]}"; do
              name=$(basename "$package")
              if [[ $name == *-x86_64.pkg.tar.zst ]]; then
                install_asset=$name
                break
              fi
            done
          fi
          install_asset=${install_asset:-$(basename "${packages[0]}")}

          # The DMS plugin, when the packaged tree has it: a tarball users
          # unpack into ~/.config/dms/plugins. Same name per version, so a
          # rebuild replaces it.
          plugin_tarball=
          if [[ -d packaging/dms/baocodeQuestions ]]; then
            plugin_tarball="$RUNNER_TEMP/baocodeQuestions-$VERSION.tar.gz"
            tar --sort=name --owner=0 --group=0 --numeric-owner \
              -czf "$plugin_tarball" -C packaging/dms baocodeQuestions
          fi

          body=$RUNNER_TEMP/release-body.md
          {
            if [[ -s $notes_file ]]; then
              cat "$notes_file"
              printf '\n---\n\n'
            fi
            printf '**Source commit:** [`%s`](https://github.com/%s/commit/%s)\n\n' \
              "${SOURCE_COMMIT:0:12}" "$GITHUB_REPOSITORY" "$SOURCE_COMMIT"
            printf '**Packages**\n\n'
            for package in "${packages[@]}"; do
              printf -- '- `%s`\n' "$(basename "$package")"
            done
            printf '\n**Install**\n\n```bash\n'
            printf 'sudo pacman -U %s\n' "$install_asset"
            printf 'yay -S baocode-bin\n'
            printf '```\n\n'
            if [[ -n $plugin_tarball ]]; then
              plugin_name=$(basename "$plugin_tarball")
              printf '**DMS questions plugin (Arch)**\n\n'
              printf 'Shows the questions a BaoCode agent is waiting on in a DMS popup and sends the answer back. Requires the `baocode` source package; `baocode-bin` is the upstream binary and does not include the app-side bridge.\n\n'
              printf '```bash\n'
              printf 'mkdir -p ~/.config/dms/plugins\n'
              printf 'tar -xzf %s -C ~/.config/dms/plugins\n' "$plugin_name"
              printf 'dms ipc call plugins enable baocodeQuestions\n'
              printf '```\n\n'
              printf -- '- `%s`\n\n' "$plugin_name"
            fi
            printf 'Upstream release: https://github.com/baocode-dev/baocode/releases/tag/v%s\n' \
              "$VERSION"
          } > "$body"

          # Latest only for upstream's own latest release: an explicitly
          # requested old version must not take the badge from a newer mirror.
          latest=false
          upstream_latest=$(gh api repos/baocode-dev/baocode/releases/latest \
            --jq .tag_name)
          if [[ $upstream_latest == "$TAG" ]]; then
            latest=true
          fi

          # The tag was created or moved by prepare. Reruns and forced
          # rebuilds replace assets of the same name instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The API sets make_latest explicitly; gh release edit does not
            # reliably clear an old release's badge with --latest=false.
            release_id=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
            jq -n --rawfile body "$body" --arg title "BaoCode $VERSION" \
              --arg latest "$latest" \
              '{body: $body, title: $title, make_latest: $latest}' \
              > "$RUNNER_TEMP/release.json"
            gh api -X PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --input "$RUNNER_TEMP/release.json" >/dev/null

            # --clobber replaces only same-named assets. A forced rebuild
            # (new pkgrel) or an explicit-version re-mirror (new source
            # pkgver) would leave the old package names beside this run's,
            # so the release must end up with exactly these four packages
            # and this version's plugin tarball. Other assets are left alone.
            mapfile -t keep < <(
              for package in "${packages[@]}"; do
                basename "$package"
              done
            )
            mapfile -t existing < <(
              gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                --jq '.assets[].name'
            )
            plugin_name=
            if [[ -n $plugin_tarball ]]; then
              plugin_name=$(basename "$plugin_tarball")
            fi
            for name in "${existing[@]}"; do
              stale=false
              if [[ $name == *.pkg.tar.zst ]]; then
                stale=true
                for kept in "${keep[@]}"; do
                  if [[ $name == "$kept" ]]; then
                    stale=false
                    break
                  fi
                done
              elif [[ -n $plugin_name && $name == baocodeQuestions-*.tar.gz &&
                $name != "$plugin_name" ]]; then
                # An older version's plugin tarball.
                stale=true
              fi
              if $stale; then
                gh release delete-asset "$TAG" "$name" --yes
              fi
            done
            gh release upload "$TAG" --clobber "${packages[@]}"
            if [[ -n $plugin_tarball ]]; then
              gh release upload "$TAG" --clobber "$plugin_tarball"
            fi
          else
            assets=("${packages[@]}")
            if [[ -n $plugin_tarball ]]; then
              assets+=("$plugin_tarball")
            fi
            gh release create "$TAG" --title "BaoCode $VERSION" \
              --notes-file "$body" "--latest=$latest" "${assets[@]}"
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Published $TAG with ${#packages[@]} package(s)"

  aur:
    name: Publish to the AUR
    needs: publish
    runs-on: ubuntu-latest
    # base-devel supplies makepkg (and refuses to run it as root), so the
    # .SRCINFO check runs as the throwaway builder below.
    container: archlinux:base-devel
    permissions:
      contents: read
    env:
      # Job-level so the push step's `if` can read it: a job-level `if`
      # cannot read secrets. Unset/empty when the repository secret is not
      # configured, which only skips the push.
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Install the AUR tools
        shell: bash
        run: |
          set -euo pipefail
          pacman --disable-sandbox -Syu --noconfirm --needed git openssh

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.publish.outputs.tag }}
          fetch-depth: 1

      - name: Create the non-root builder
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Validate .SRCINFO
        shell: bash
        run: |
          set -euo pipefail
          cd packaging/aur/baocode-bin
          generated=$RUNNER_TEMP/generated.SRCINFO
          runuser -u builder -- env HOME=/home/builder makepkg --printsrcinfo \
            > "$generated"
          if ! diff -u .SRCINFO "$generated"; then
            echo "::error::.SRCINFO is stale: regenerate it with makepkg --printsrcinfo"
            exit 1
          fi

      # The secret is set on the job env, so the step can test it directly.
      - name: Push the package to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        shell: bash
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          ssh-keyscan -T 15 aur.archlinux.org >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"

          aur_dir=$RUNNER_TEMP/aur-baocode-bin
          rm -rf "$aur_dir"
          # Fails until the package exists on aur.archlinux.org: creating it
          # and adding the public key are one-time manual steps.
          git clone --depth 1 \
            ssh://aur@aur.archlinux.org/baocode-bin.git "$aur_dir"
          cp packaging/aur/baocode-bin/PKGBUILD \
            packaging/aur/baocode-bin/.SRCINFO "$aur_dir/"
          cd "$aur_dir"
          if [[ -z $(git status --porcelain -- PKGBUILD .SRCINFO) ]]; then
            echo "::notice::The AUR package already has this version"
            exit 0
          fi

          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          pkgrel=$(sed -n 's/^pkgrel=//p' PKGBUILD)
          git config user.name 'NmouZh'
          git config user.email '311303632+NmouZh@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          git commit -m "upgpkg: baocode-bin $pkgver-$pkgrel"
          git push origin master
